name: odonto-recepcion-langchain
services:
  reception:
    build: .
    env_file: .env
    environment:
      RECEPTION_DB: /data/reception.db
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - reception_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  reception_data:
