[project]
name = "odonto-recepcion-langchain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langchain>=1,<2", "langchain-google-genai>=4,<5", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.27,<1", "pydantic-settings>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recepcion*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "audit"]
python_files = ["test_*.py", "acceptance_probes.py"]
